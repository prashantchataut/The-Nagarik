# Local Postgres for Payload CMS when Neon is not yet provisioned.
# Usage: docker compose up -d
# Then set DATABASE_URL in .env.local to the URL below.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nagarik-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nagarik
      POSTGRES_PASSWORD: nagarik_dev_password
      POSTGRES_DB: nagarik
    volumes:
      - nagarik_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nagarik -d nagarik']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nagarik_pg_data:
